# Render 部署蓝图：一个 Web 服务同时托管前端 + 后端 API（同源、免备案）
services:
  - type: web
    name: rep-erp
    runtime: node
    plan: free
    region: oregon          # 境外节点（美国），无需 ICP 备案
    branch: main
    buildCommand: npm install && npm run build
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGIN
        value: "*"
      - key: PORT
        sync: false
    # 说明：免费实例在一段时间无访问后会休眠，首次访问需等待数秒唤醒。
    # 数据默认存于容器文件系统（重启重建会清空）。如需永久保存，请在 Render 控制台
    # 挂载一个 Disk（持久磁盘）并把环境变量 DATA_DIR 指向该磁盘挂载路径。
